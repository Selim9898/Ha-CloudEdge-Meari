ptz:
  name: PTZ Control
  description: Control PTZ (Pan-Tilt-Zoom) movement on a CloudEdge / Meari camera.
  target:
    entity:
      integration: cloudplus
      domain: camera
  fields:
    action:
      name: Action
      description: The PTZ action to perform.
      required: true
      selector:
        select:
          options:
            - label: Move
              value: move
            - label: Stop
              value: stop
    argument:
      name: Argument
      description: Direction for the move action.
      selector:
        select:
          options:
            - label: Left
              value: left
            - label: Right
              value: right
            - label: Up
              value: up
            - label: Down
              value: down

talk_tone:
  name: Talk test tone
  description: >-
    Play a sine tone on a battery camera's speaker through the talk channel,
    for supervised testing. Wakes the camera if needed. Admin only.
  fields:
    entity_id:
      name: Camera
      description: The CloudEdge / Meari camera entity.
      required: true
      selector:
        entity:
          integration: cloudplus
          domain: camera
    frequency:
      name: Frequency
      description: Tone frequency in Hz.
      default: 800
      selector:
        number:
          min: 100
          max: 4000
          unit_of_measurement: Hz
    duration:
      name: Duration
      description: Tone length in seconds (max 5).
      default: 2
      selector:
        number:
          min: 0.1
          max: 5
          step: 0.1
          unit_of_measurement: s
    volume:
      name: Volume
      description: Amplitude factor from 0 to 1 (the camera's speaker volume setting still applies).
      default: 0.5
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
